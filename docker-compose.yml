version: "3.8"

services:
  web-server:
    image: nginx:latest
    volumes:
      - ./:/var/www/app
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "8${PORT_PART}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - php
    networks:
      - my_network

  php:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    volumes:
      - ./:/var/www/app
    environment:
      XDEBUG_CONFIG: "client_host=host.docker.internal remote_enable=1"
      PHP_IDE_CONFIG: "serverName=php"
    ports:
      - "9000:9000"
    networks:
      - my_network
    depends_on:
      - db
      - redis

  db:
    image: postgres:alpine
    ports:
      - "5${PORT_PART}:5432"
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    networks:
      - my_network

  redis:
    image: redis:alpine
    ports:
      - "6${PORT_PART}:6379"
    networks:
      - my_network

networks:
  my_network:
    driver: bridge
